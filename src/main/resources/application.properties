# The name of the application is student-api
spring.application.name=student-api
# jdbc:<Database Type>://<Which machine>:<port>/<which database>
spring.datasource.url=jdbc:postgresql://localhost:5432/student_api
# When you get to the database, log in as the user chesonma.
spring.datasource.username=chesonma
spring.datasource.password=
# Every time the program starts, check the database, if entity columns are missing, when you need ddl operations, use update way
spring.jpa.hibernate.ddl-auto=update
# Print every SQL Hibernate writes (layer 3) to the console.
spring.jpa.show-sql=true
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always


